<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌶️</text></svg>">
  <title>Melody Lane Links</title>
  <meta name="description" content="Official Melody Lane links for polls, private updates, Instagram, X, Threads, and member routing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #130f1f;
      --bg-mid: #19223a;
      --bg-end: #0d3240;
      --accent: #ff006e;
      --accent-soft: #ff99c8;
      --cyan: #72e8ff;
      --gold: #ffd166;
      --text: #ffffff;
      --muted: #dedee8;
      --panel: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 0, 110, 0.22), transparent 34%),
        radial-gradient(circle at 90% 18%, rgba(114, 232, 255, 0.14), transparent 30%),
        linear-gradient(135deg, var(--bg-start), var(--bg-mid) 52%, var(--bg-end));
      line-height: 1.6;
    }

    .wrap {
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 46px;
    }

    .profile {
      text-align: center;
      padding: 10px 0 24px;
    }

    .avatar {
      width: 132px;
      height: 132px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent);
      box-shadow: 0 14px 46px rgba(0, 0, 0, 0.36);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.7rem;
      line-height: 1;
      margin-bottom: 10px;
    }

    .bio {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .link {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.36);
      background: rgba(255, 255, 255, 0.11);
    }

    .link.primary {
      border: none;
      background: linear-gradient(135deg, var(--accent), #ff4081);
      box-shadow: 0 12px 30px rgba(255, 0, 110, 0.28);
    }

    .link.gold {
      color: var(--gold);
      border-color: rgba(255, 209, 102, 0.42);
    }

    .hint {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 20px;
      text-align: center;
    }

    .hint a { color: var(--accent-soft); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="profile">
      <div class="avatar">
        <img src="images/melody-profile.jpg" alt="Melody Lane">
      </div>
      <h1>Melody Lane</h1>
      <p class="bio">Horror, Cleveland sports, music moods, weekly polls, and private updates.</p>
    </section>

    <section class="links" aria-label="Melody Lane links">
      <a class="link primary" href="https://t.me/theemelodylanebot?start=links_private_updates" target="_blank" rel="noopener">
        <span>Join Private Updates</span>
        <span>Telegram</span>
      </a>
      <a class="link" href="poll-current.html">
        <span>Vote Current Poll</span>
        <span>Poll</span>
      </a>
      <a class="link" href="index.html">
        <span>Visit The Site</span>
        <span>Home</span>
      </a>
      <a class="link" href="https://www.instagram.com/theemelodylane/" target="_blank" rel="noopener">
        <span>Instagram</span>
        <span>@theemelodylane</span>
      </a>
      <a class="link" href="https://x.com/Theemelodylane" target="_blank" rel="noopener">
        <span>X</span>
        <span>@Theemelodylane</span>
      </a>
      <a class="link" href="https://www.threads.com/@theemelodylane" target="_blank" rel="noopener">
        <span>Threads</span>
        <span>@theemelodylane</span>
      </a>
    </section>

    <p class="hint">Instagram-safe page. Private updates are on Telegram. Digital only.</p>
  </main>
</body>
</html>
